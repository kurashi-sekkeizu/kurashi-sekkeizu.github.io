<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>あなたの設計図｜くらしの設計図（プロトタイプ）</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="has-lock">
<div class="proto-banner">🧪 お試し版です。<b>操作はすべて動きます</b>が、<b>金額はダミー</b>なので、実際の金額としては使えません。</div>
<header class="app-header">
  <div class="wrap">
    <a class="linkbtn" href="/soudan/confirm/">← 回答に戻る</a>
    <span class="title">結果</span>
    <button type="button" class="linkbtn danger" data-delete>🗑 削除</button>
  </div>
</header>

<main class="wrap">
  <noscript><p class="note warn">相談機能はJavaScriptを有効にするとお使いいただけます。</p></noscript>
  <div id="incomplete" hidden>
    <p class="note warn">まだ答えていない質問があるため、結果を表示できません。</p>
    <a class="btn" href="/soudan/step/">続きから答える</a>
  </div>
  <div id="app" hidden></div>
</main>
<div class="lock-bar">🔒 入力内容は送信されません</div>

<script src="/assets/common.js"></script>
<script src="/assets/questions.js"></script>
<script src="/assets/calc.js"></script>
<script src="/assets/charts.js"></script>
<script src="/assets/summary.js"></script>
<script>
(function () {
  const d = KS.load().data;
  const A = d.answers;
  const esc = KS.esc, man = KS.man;
  if (KSQ.visible(A).some((q) => q.required && !KSQ.isAnswered(q, A))) {
    document.getElementById("incomplete").hidden = false;
    return;
  }
  const app = document.getElementById("app");
  app.hidden = false;
  const openState = new Set();

  function render() {
    const r = KSC.compute(d);
    const today = new Date();
    const dateStr = `${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日`;
    const top3 = r.todos.slice(0, 3);

    const todoCard = (t, i) => `
      <details class="todo2">
        <summary><span class="num" aria-hidden="true">${i + 1}</span><span class="todo2-title"><span class="visually-hidden">${i + 1}つ目：</span>${esc(t.title)}</span><span class="todo2-when">${esc(t.when)}</span></summary>
        <div class="todo2-body">
          <p>${esc(t.reason)}</p>
          <p style="margin:0">→ <a href="${t.link.href}">${esc(t.link.text)}</a></p>
        </div>
      </details>`;

    const death = r.death ? `
      <h3>万一のときの保障額（死亡）</h3>
      <p class="big-num">${man(r.death.low)} 〜 ${man(r.death.high)}</p>
      <details class="help"><summary>内訳を見る</summary><div class="kv">
        <span>遺族の支出（${r.death.years}年分・生活費${d.assumptions.ratioLow}〜${d.assumptions.ratioHigh}%）</span><span class="v">${man(r.death.breakdown.expenseLow)}〜${man(r.death.breakdown.expenseHigh)}</span>
        <span>　うち教育費</span><span class="v">${man(r.death.breakdown.eduRemain)}</span>
        <span>− 遺族年金など</span><span class="v">${man(r.death.breakdown.survivorPension)}</span>
        <span>− 配偶者の収入</span><span class="v">${man(r.death.breakdown.spouseInc)}</span>
        <span>− 貯蓄</span><span class="v">${man(r.death.breakdown.savings)}</span>
        <span class="total">不足の目安</span><span class="v total">${man(r.death.low)}〜${man(r.death.high)}</span>
      </div>${r.death.breakdown.loanNote ? '<p class="small" style="margin-top:6px">住宅ローンは、団信で完済される前提で支出から除いています。</p>' : ""}</details>
      <p class="small">幅の理由：遺族の生活費を、現在の${d.assumptions.ratioLow}%〜${d.assumptions.ratioHigh}%で計算しています。</p>`
      : `<h3>万一のときの保障額（死亡）</h3><p>扶養しているご家族がいないため、計算していません。</p>`;

    const retire = r.retire ? `
      <h3 style="margin-top:20px">老後の不足額（65歳時点）</h3>
      <div class="kv">
        <span>運用しない場合</span><span class="v"><b>${man(r.retire.gap0)}</b>（毎月 約${man(r.retire.monthly0)}の積立で埋まる計算）</span>
        ${r.retire.gapR !== null ? `<span>年${r.ret}%で運用した場合</span><span class="v"><b>${man(r.retire.gapR)}</b>（毎月 約${man(r.retire.monthlyR)}）</span>` : ""}
      </div>
      <p class="small">※運用成果は保証されません。運用しない場合の数字を必ず確認してください。</p>` : "";

    const dis = `
      <h3 style="margin-top:20px">働けなくなったとき（月あたりの不足）</h3>
      <div class="kv">
        <span>はじめの1年6か月</span><span class="v">${man(r.disability.first)}</span>
        <span>それ以降</span><span class="v">${man(r.disability.after)}</span>
      </div>
      <p class="small">${r.disability.hasSick ? "休業中の手当がある前提で計算しています。" : "休業中の手当がない働き方として計算しています。"}</p>`;

    const insurance = `
      <h3 style="margin-top:20px">保険の種類ごとの優先度</h3>
      ${r.insurance.map((x) => `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(x.name)}</b><br><span class="level ${x.level.cls}">${esc(x.level.text)}</span><p class="small" style="margin:4px 0 0">${esc(x.reason)}</p></div>`).join("")}
      <p class="small" style="margin-top:8px">特定の商品をすすめるものではありません。 → <a href="/sources/">公的な情報を見る</a></p>`;

    const sections = [
      { id: "todo", title: "やることリスト（すべて）", html: r.todos.length ? r.todos.map(todoCard).join("") : "<p>いま特に急ぐことは見つかりませんでした。</p>" },
      { id: "review", title: "見直せるかもしれない支出", html: `
          <p class="note info">固定費（通信費・電気代など）は「くわしく入力（固定費）」で答えると表示されます。</p>
          <div class="card"><b>表示例：通信費</b><br><span class="level l2">見直しの余地があるかもしれません</span>
          <p class="small" style="margin:6px 0">同じ世帯人数の平均より、月約5,000円多い傾向です（出典：総務省 家計調査／確認日を表示）</p>
          <p class="small" style="margin:0">→ <a href="/sources/">出典を見る</a></p></div>
          <p class="small" style="margin-top:8px">保険料は、この一覧には含めません（保険は「分野別の目安」で確認します）。</p>` },
      { id: "estimate", title: "分野別の目安", html: death + dis + retire + insurance +
          `<p class="small" style="margin-top:12px">言葉の意味：<a href="/learn/izoku-nenkin/">遺族年金</a>　<a href="/learn/kougaku-ryouyouhi/">高額療養費</a>　<a href="/learn/roukogo-2000man/">老後2000万円問題</a>　<a href="/learn/">ほかの解説を見る</a></p>` },
      { id: "ask", title: "専門家に聞くこと", html: `<ul>${r.ask.map((x) => `<li>${esc(x.q)}<br><span class="muted small">相談先の例：${esc(x.who)}</span></li>`).join("")}</ul><p class="small">自分で書き足したいことは、PDF作成の画面で追加できます。</p>` },
    ];

    app.innerHTML = `
      <h1>あなたの設計図</h1>
      <p class="muted" style="margin-bottom:6px">${dateStr}時点の目安</p>
      ${r.provisional.length ? `<p class="note warn">⚠ 仮の値を含みます：${esc(r.provisional.join("、"))}</p>` : ""}

      <section class="section" id="forecast-block">
        <h2 class="section-title">① 見通し</h2>
        <p class="small muted" style="margin-bottom:8px">言葉がわからないときは <a href="/learn/">やさしく学ぶ</a> で確認できます。</p>
        <div id="forecast"></div>
        <div id="advice" class="section" style="margin-top:12px"></div>
      </section>

      <section class="section" id="costs-block">
        <h2 class="section-title">② 計算に使っている毎月の支出（いま）</h2>
        <p class="small">実際と<b>月2万円以上違う項目</b>は、押して「くわしく入力で直す」へ。</p>
        <div id="costs"></div>
        <details class="fold" id="cost-table-fold" style="margin-top:12px">
          <summary>年ごとに見る（費目×年の表）</summary>
          <div class="body" id="cost-table"></div>
        </details>
      </section>

      <section class="section">
        <h2 class="section-title">③ まずやること 3つ</h2>
        ${top3.length ? top3.map(todoCard).join("") : '<p class="card">いま特に急ぐことは見つかりませんでした。</p>'}
      </section>

      <section class="section" id="timeline-block">
        <h2 class="section-title">④ ライフプラン表</h2>
        <div id="timeline"></div>
      </section>

      <section class="section" id="viz-block">
        <h2 class="section-title">⑤ お金の流れ</h2>
        <p class="small muted" style="margin-bottom:8px">グラフを触る（またはキーボードの矢印キー）と、その年の内訳が出ます。</p>
        <div id="viz"></div>
        <p class="small" style="margin-top:8px">前提：物価上昇 年${d.assumptions.inflation}% ／ 運用 年${d.assumptions.ret}%　<button type="button" class="linkbtn" data-open-sheet>前提を変える</button></p>
      </section>

      <section class="section" id="notinc-block">
        <h2 class="section-title">⑥ この計算に入れていないこと</h2>
        <div id="notinc"></div>
      </section>

      <div class="section"><a class="btn" href="/soudan/pdf/">📄 PDFで保存・印刷する</a></div>

      <section class="section">
        <h2 class="section-title">くわしく見る</h2>
        ${sections.map((s) => `<details class="fold" data-sec="${s.id}" ${openState.has(s.id) ? "open" : ""}><summary>${esc(s.title)}</summary><div class="body">${s.html}</div></details>`).join("")}
      </section>

      <section class="section">
        <h2 class="section-title">精度を上げる</h2>
        <div class="stack">
          <button type="button" class="btn secondary" data-open-sheet>前提を変える</button>
          <a class="btn secondary" href="/soudan/detail/">くわしく入力する（進学・車・住まい・介護・出費・収入の変化）</a>
        </div>
        <div id="sheet-slot"></div>
      </section>

      <p class="disclaimer">この結果は一般的な計算による目安で、特定の商品をすすめるものではありません。運用成果を保証するものでもありません。運営者は保険代理店・金融機関ではありません。<a href="/about/">このサイトについて</a></p>`;

    KSV.mount(document.getElementById("viz"), r);
    document.getElementById("forecast").appendChild(KSR.forecast(r, (target) => {
      if (target === "estimate") {
        const det = document.querySelector('[data-sec="estimate"]');
        det.open = true;
        openState.add("estimate");
        det.scrollIntoView({ behavior: "smooth", block: "start" });
      } else {
        document.getElementById(target === "costs" ? "costs-block" : "viz-block").scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }));
    document.getElementById("costs").appendChild(KSR.costs(r, A, (section) => {
      try { sessionStorage.setItem("ks-open-section", section); } catch (e) { /* 保存できなくても画面は開く */ }
      location.href = "/soudan/detail/";
    }));
    document.getElementById("timeline").appendChild(KSR.lifeTable(r));
    document.getElementById("notinc").appendChild(KSR.notIncluded(r, A));
    const ctFold = document.getElementById("cost-table-fold");
    let ctBuilt = false;
    const buildCostTable = () => {
      if (ctBuilt) return;
      ctBuilt = true;
      document.getElementById("cost-table").appendChild(KSR.costTable(r));
    };
    ctFold.addEventListener("toggle", () => { if (ctFold.open) { buildCostTable(); openState.add("costTable"); } else openState.delete("costTable"); });
    if (openState.has("costTable")) { ctFold.open = true; buildCostTable(); }
    document.getElementById("advice").appendChild(KSR.advice(r, (section) => {
      try { sessionStorage.setItem("ks-open-section", section); } catch (e) { /* 保存できなくても画面は開く */ }
      location.href = "/soudan/detail/";
    }));
    app.querySelectorAll("details.fold").forEach((el) => el.addEventListener("toggle", () => {
      el.open ? openState.add(el.dataset.sec) : openState.delete(el.dataset.sec);
    }));
    app.querySelectorAll("[data-open-sheet]").forEach((b) => b.addEventListener("click", openSheet));
  }

  function openSheet() {
    const slot = document.getElementById("sheet-slot");
    const as = d.assumptions;
    const radios = (name, values, cur, unit) => values.map((v) => `<label><input type="radio" name="${name}" value="${v}" ${v === cur ? "checked" : ""}>${v}${unit}</label>`).join("");
    const pct = [60, 70, 80, 90, 100];
    slot.innerHTML = `
      <form class="sheet" id="sheet" aria-labelledby="sheet-title">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h2 id="sheet-title" style="margin:0">前提を変える</h2>
          <button type="button" class="linkbtn" id="sheet-close" aria-label="閉じる">✕ 閉じる</button>
        </div>
        <fieldset style="margin-top:12px"><legend style="font-size:1rem">物価の上昇率（年）</legend>
          <div class="radio-row">${radios("inflation", [0, 1, 2], as.inflation, "%")}</div>
          <details class="help"><summary>なぜ1%が初期値？</summary><div>長い期間の計算で物価上昇を無視すると、将来の支出を少なく見積もってしまうためです（プロトタイプの仮の設定）。</div></details>
        </fieldset>
        <fieldset style="margin-top:8px"><legend style="font-size:1rem">運用利回り（年）</legend>
          <div class="radio-row">${radios("ret", [0, 1, 3], as.ret, "%")}</div>
          <p class="note warn small">⚠ 運用成果は保証されません。0%の場合は常に並べて表示します。</p>
        </fieldset>
        <fieldset style="margin-top:8px"><legend style="font-size:1rem">万一のときの遺族の生活費（現在に対する割合）</legend>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <label class="visually-hidden" for="rl">下限</label><select class="select" id="rl" style="width:auto">${pct.map((p) => `<option ${p === as.ratioLow ? "selected" : ""}>${p}</option>`).join("")}</select>
            <span>% 〜</span>
            <label class="visually-hidden" for="rh">上限</label><select class="select" id="rh" style="width:auto">${pct.map((p) => `<option ${p === as.ratioHigh ? "selected" : ""}>${p}</option>`).join("")}</select>
            <span>%</span>
          </div>
        </fieldset>
        <p id="sheet-err" class="error" role="alert" hidden></p>
        <div class="stack" style="margin-top:14px">
          <button type="submit" class="btn">この前提で再計算</button>
          <button type="button" class="linkbtn" id="sheet-reset">初期値に戻す</button>
        </div>
      </form>`;
    const form = document.getElementById("sheet");
    form.querySelector("#sheet-title").setAttribute("tabindex", "-1");
    form.querySelector("#sheet-title").focus();
    form.scrollIntoView({ behavior: "smooth", block: "start" });
    document.getElementById("sheet-close").addEventListener("click", () => { slot.innerHTML = ""; });
    document.getElementById("sheet-reset").addEventListener("click", () => {
      d.assumptions = KS.empty().assumptions;
      KS.save(d);
      render();
      openSheet();
    });
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const lo = Number(document.getElementById("rl").value), hi = Number(document.getElementById("rh").value);
      if (lo > hi) {
        const er = document.getElementById("sheet-err");
        er.textContent = "下限は上限以下にしてください。";
        er.hidden = false;
        return;
      }
      d.assumptions = {
        inflation: Number(form.querySelector('input[name="inflation"]:checked').value),
        ret: Number(form.querySelector('input[name="ret"]:checked').value),
        ratioLow: lo, ratioHigh: hi,
      };
      KS.save(d);
      render();
      document.getElementById("viz-block").scrollIntoView({ behavior: "smooth", block: "start" });
    });
  }

  render();
})();
</script>
</body>
</html>

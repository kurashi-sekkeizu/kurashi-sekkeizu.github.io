<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>質問｜くらしの設計図（プロトタイプ）</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="has-lock">
<div class="proto-banner">🧪 お試し版です。<b>操作はすべて動きます</b>が、<b>金額はダミー</b>なので、実際の金額としては使えません。</div>
<header class="app-header">
  <div class="wrap">
    <button type="button" class="linkbtn" id="back">← 前の質問</button>
    <span class="title" id="count" aria-live="polite"></span>
    <button type="button" class="linkbtn danger" data-delete>🗑 削除</button>
  </div>
  <div class="progress" aria-hidden="true"><div id="bar" style="width:0"></div></div>
</header>

<main class="wrap">
  <noscript><p class="note warn">相談機能はJavaScriptを有効にするとお使いいただけます。</p></noscript>
  <form id="form" novalidate>
    <div id="screen"></div>
  <div id="more"></div>
    <p id="err" class="error" role="alert" hidden></p>
    <div class="section stack">
      <button type="submit" class="btn">次へ</button>
      <button type="button" class="linkbtn" id="to-chat">💬 会話形式に切り替える</button>
    </div>
  </form>
</main>
<footer class="app-footer no-print">
  <div class="wrap">
    <a class="linkbtn" href="/">🏠 くらしの設計図のトップへ</a>
    <span class="small muted">答えた内容は、この端末の中だけにあります</span>
  </div>
</footer>
<div class="lock-bar">🔒 入力内容は送信されません</div>

<script src="/assets/common.js"></script>
<script src="/assets/data.js"></script>
<script src="/assets/questions.js"></script>
<script src="/assets/calc.js"></script>
<script src="/assets/detail.js"></script>
<script>
(function () {
  const d = KS.load().data;
  d.meta.mode = "step";
  const A = d.answers;
  let screens = KSQ.screens(A);
  let idx = startIndex();

  function startIndex() {
    if (d.meta.pos) {
      const i = screens.findIndex((s) => s.some((q) => q.id === d.meta.pos));
      if (i >= 0) return i;
    }
    const i = screens.findIndex((s) => s.some((q) => q.required && !KSQ.isAnswered(q, A)));
    if (i >= 0) return i;
    // 全部答え終わっている（確認画面から戻ってきた）ときは、最後の画面を出す
    return Math.max(0, screens.length - 1);
  }

  function control(q) {
    const name = q.id;
    const v = A[q.id];
    const help = (q.why ? `<details class="help"><summary>なぜ聞くの？</summary><div>${KS.esc(q.why)}</div></details>` : "") +
      (q.help ? `<details class="help"><summary>${KS.esc(q.help.title)}</summary><div>${KS.esc(q.help.body)}` +
        (q.help.link ? ` <a href="${q.help.link}">${KS.esc(q.help.linkText || "くわしく見る")}</a>` : "") + `</div></details>` : "");
    const hintText = typeof q.hint === "function" ? q.hint(A) : q.hint;
    const hint = hintText ? `<p class="q-hint">${KS.esc(hintText)}</p>` : "";

    if (q.type === "single" || q.type === "multi") {
      const t = q.type === "single" ? "radio" : "checkbox";
      const opts = q.options.map((o) => {
        const checked = q.type === "single" ? String(v) === String(o.v) : Array.isArray(v) && v.includes(o.v);
        const tip = o.help
          ? `<details class="opt-help"><summary aria-label="${KS.esc(o.label)}の説明">？</summary><div>${KS.esc(o.help.text)}` +
            (o.help.link ? ` <a href="${o.help.link}">くわしく読む</a>` : "") + `</div></details>`
          : "";
        return `<div class="option-row"><label class="option${o.v === "unknown" ? " unknown" : ""}"><input type="${t}" name="${name}" value="${KS.esc(o.v)}" ${checked ? "checked" : ""}><span>${KS.esc(o.label)}</span></label>${tip}</div>`;
      }).join("");
      return `<fieldset class="q-block" data-q="${q.id}"><legend>${KS.esc(KSQ.labelOf(q, A))}</legend>${hint}${help}<div class="options">${opts}</div></fieldset>`;
    }
    if (q.type === "select") {
      const opts = `<option value="">選んでください</option>` + q.options.map((o) => `<option value="${o.v}" ${String(v) === String(o.v) ? "selected" : ""}>${KS.esc(o.label)}</option>`).join("");
      return `<div class="q-block" data-q="${q.id}"><label for="f-${name}" style="display:block;font-size:1.25rem;font-weight:700">${KS.esc(KSQ.labelOf(q, A))}</label>${hint}${help}<select class="select" id="f-${name}" name="${name}" style="margin-top:10px">${opts}</select></div>`;
    }
    if (q.type === "ages") {
      const n = Number(A.kidsCount) || 0;
      if (!n) return `<div class="q-block" data-q="${q.id}"><p class="muted">人数を選ぶと、年齢を入力できます。</p></div>`;
      const cur = Array.isArray(v) ? v : [];
      let rows = "";
      for (let i = 0; i < n; i++) {
        const opts = `<option value="">選んでください</option>` + Array.from({ length: 26 }, (_, a) => `<option value="${a}" ${String(cur[i]) === String(a) ? "selected" : ""}>${a}歳</option>`).join("");
        rows += `<div class="field-row"><label for="f-age-${i}">${i + 1}人目</label><select class="select" id="f-age-${i}" data-age="${i}">${opts}</select></div>`;
      }
      return `<fieldset class="q-block" data-q="${q.id}"><legend>${KS.esc(KSQ.labelOf(q, A))}</legend>${rows}</fieldset>`;
    }
    return "";
  }

  // まとまりごとに、同じ画面で深められる「詳しい条件」を出す
  const DETAIL_OF_GROUP = {
    you: ["work"],
    family: ["family", "spouseWork", "edu"],
    home: ["home", "car", "loans"],
    money: ["living", "assets", "insurance", "spend", "assumptions"],
  };

  // ここまでの画面の必須が埋まっていれば、詳しい条件を組み立てられる
  function detailReady() {
    return !screens.slice(0, idx + 1).flat().some((q) => q.required && !KSQ.isAnswered(q, A));
  }

  function renderDetail(groupKey) {
    const slot = document.getElementById("more");
    slot.replaceChildren();
    const keys = DETAIL_OF_GROUP[groupKey];
    if (!keys || !detailReady() || typeof KSD === "undefined") return;
    const det = document.createElement("details");
    det.className = "fold more-fold";
    const sum = document.createElement("summary");
    sum.textContent = "詳しい条件を入力する（あとからでも大丈夫です）";
    det.appendChild(sum);
    const body = document.createElement("div");
    body.className = "body";
    det.appendChild(body);
    det.addEventListener("toggle", () => { if (det.open) moreOpen.add(groupKey); else moreOpen.delete(groupKey); });
    det.open = moreOpen.has(groupKey);
    slot.appendChild(det);
    KSD.build(d, { only: keys, onChange: () => { /* 保存は KSD 側で行う */ } }).mount(body);
  }
  const moreOpen = new Set();

  function render(focus) {
    const s = screens[idx];
    const title = s[0].groupTitle ? `<h1 style="font-size:1.1rem;color:var(--muted)">${KS.esc(s[0].groupTitle)}</h1>` : "";
    document.getElementById("screen").innerHTML = title + s.map(control).join("");
    renderDetail(s[0].group);
    document.getElementById("count").textContent = `${idx + 1}／${screens.length}`;
    document.getElementById("bar").style.width = `${Math.round((idx / screens.length) * 100)}%`;
    document.getElementById("err").hidden = true;
    document.getElementById("back").textContent = idx === 0 ? "← 戻る" : "← 前の質問";
    d.meta.pos = s[0].id;
    KS.save(d);
    if (focus) {
      const first = document.querySelector("#screen legend, #screen label[for]");
      if (first) { first.setAttribute("tabindex", "-1"); first.focus(); }
    }
  }

  // 入力のたびに回答を保存（画面は勝手に進めない）
  document.getElementById("screen").addEventListener("change", (e) => {
    const t = e.target;
    if (t.dataset.age !== undefined) {
      const n = Number(A.kidsCount) || 0;
      const arr = Array.isArray(A.kidsAges) ? A.kidsAges.slice(0, n) : [];
      while (arr.length < n) arr.push(null);
      arr[Number(t.dataset.age)] = t.value === "" ? null : Number(t.value);
      A.kidsAges = arr;
    } else {
      const q = KSQ.byId[t.name];
      if (!q) return;
      if (q.type === "multi") {
        A[q.id] = [...document.querySelectorAll(`input[name="${q.id}"]:checked`)].map((i) => i.value);
      } else if (q.type === "select") {
        A[q.id] = t.value === "" ? null : (q.text ? t.value : Number(t.value));
      } else {
        A[q.id] = q.id === "kidsCount" ? Number(t.value) : t.value;
        // 人数を変えたら、年齢の欄も同じ数にそろえる（減らしたときに古い値が残って先へ進めなくなる）
        if (q.id === "kidsCount") {
          const n = Number(A.kidsCount) || 0;
          const arr = Array.isArray(A.kidsAges) ? A.kidsAges.slice(0, n) : [];
          while (arr.length < n) arr.push(null);
          A.kidsAges = arr;
        }
      }
      KS.forgetDetail(d, q.id);
      // 回答によって同じ画面の質問が増減する場合（子の人数→年齢欄、持ち家→戸建て/マンション）は描き直す
      const before = screens[idx].map((x) => x.id).join(",");
      const nextScreens = KSQ.screens(A);
      const now = nextScreens.find((sc) => sc.some((x) => x.id === screens[idx][0].id));
      const hintChanged = screens[idx].some((x) => typeof x.hint === "function");
      if (now && (q.id === "kidsCount" || hintChanged || now.map((x) => x.id).join(",") !== before)) {
        screens = nextScreens;
        idx = Math.max(0, screens.indexOf(now));
        render(false);
        document.querySelector(`input[name="${q.id}"][value="${t.value}"]`)?.focus();
      }
    }
    KS.save(d);
    // その画面の質問に答え終わった時点で「詳しい条件」を出す（答えを消したら引っ込める）
    if (!!document.querySelector("#more details") !== detailReady()) renderDetail(screens[idx][0].group);
  });

  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const missing = screens[idx].find((q) => q.required && !KSQ.isAnswered(q, A));
    const err = document.getElementById("err");
    if (missing) {
      err.textContent = missing.type === "multi" ? "1つ以上選んでください。" : missing.type === "ages" ? "お子さん全員の年齢を選んでください。" : `「${missing.label}」を選んでください。`;
      err.hidden = false;
      const target = document.querySelector(`[data-q="${missing.id}"] input, [data-q="${missing.id}"] select`);
      target?.focus();
      return;
    }
    screens[idx].forEach((q) => { if (!KSQ.isAnswered(q, A)) A[q.id] = []; if (!d.meta.done.includes(q.id)) d.meta.done.push(q.id); });
    screens = KSQ.screens(A);
    const curId = d.meta.pos;
    const cur = screens.findIndex((s) => s.some((q) => q.id === curId));
    if (cur + 1 >= screens.length) {
      d.meta.pos = null;
      KS.save(d);
      location.href = "/soudan/confirm/";
      return;
    }
    idx = cur + 1;
    render(true);
    window.scrollTo(0, 0);
  });

  document.getElementById("back").addEventListener("click", () => {
    if (idx === 0) { location.href = "/soudan/"; return; }
    idx -= 1;
    render(true);
    window.scrollTo(0, 0);
  });

  document.getElementById("to-chat").addEventListener("click", () => {
    d.meta.mode = "chat";
    KS.save(d);
    location.href = "/soudan/chat/";
  });

  render(false);
})();
</script>
</body>
</html>

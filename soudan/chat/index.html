<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>チャットで相談｜くらしの設計図</title>
<meta name="google-site-verification" content="jntYeujTZa7djhCeI4bXONFyIVFQTXFFajI_V447P28">
<link rel="canonical" href="https://kurashi-sekkeizu.github.io/soudan/chat/">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="has-lock">
<header class="app-header">
  <div class="wrap">
    <button type="button" class="linkbtn" id="undo">← 1つ戻す</button>
    <span class="title" id="count"></span>
    <button type="button" class="linkbtn danger" data-delete>削除</button>
  </div>
  <div class="progress" aria-hidden="true"><div id="bar" style="width:0"></div></div>
</header>

<main class="wrap">
  <noscript><p class="note warn">相談機能はJavaScriptを有効にするとお使いいただけます。</p></noscript>
  <div id="log" class="chat-log" style="padding-top:16px"></div>
  <p id="live" class="visually-hidden" aria-live="polite"></p>
  <div class="chat-panel" id="panel"></div>
</main>
<footer class="app-footer no-print">
  <div class="wrap">
    <a class="linkbtn" href="/">くらしの設計図のトップへ</a>
    <span class="small muted">答えた内容は、この端末の中だけにあります</span>
  </div>
</footer>
<div class="lock-bar">🔒 入力内容は送信されません</div>

<script src="/assets/common.js"></script>
<script src="/assets/data.js"></script>
<script src="/assets/questions.js"></script>
<script src="/assets/calc.js"></script>
<script src="/assets/detail.js"></script>
<script src="/assets/flow.js"></script>
<script>
(function () {
  const d = KS.load().data;
  d.meta.mode = "chat";
  const A = d.answers;
  const esc = KS.esc;

  // ── くわしくで聞く「詳しい条件」を、チャットの中で1問ずつ聞く ──
  // 定義は detail.js（1問ずつの画面と同じ）。同じ回答なら同じ結果になる（CLAUDE.md §7）
  const DETAIL_MODE = d.meta.depth === "detail";
  if (!Array.isArray(d.meta.detailDone)) d.meta.detailDone = [];

  // 詳しい条件の質問は、回答によって増減する。毎回つくり直す
  const detailAll = () => (DETAIL_MODE && typeof KSF !== "undefined" ? KSF.detailQuestions(d) : []);
  function detailCurrent() {
    return detailAll().find((f) => !d.meta.detailDone.includes(f.id)) || null;
  }
  // いま選ばれている内容を、吹き出しに出す言葉にする
  function fieldValue(el) {
    const sel = el.querySelector("select");
    if (sel) return sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent : "—";
    const checked = [...el.querySelectorAll("input:checked")];
    if (!checked.length) return "—";
    return checked.map((i) => (i.closest("label") || i.parentElement).textContent.trim()).join("、") || "—";
  }

  function answeredList() {
    return KSQ.visible(A).filter((q) => d.meta.done.includes(q.id) && (KSQ.isAnswered(q, A) || !q.required));
  }
  function current() {
    return KSQ.visible(A).find((q) => !(d.meta.done.includes(q.id) && (KSQ.isAnswered(q, A) || !q.required)));
  }

  function botText(q, prev) {
    const react = prev && prev.react ? prev.react(A[prev.id], A) : null;
    const hint = typeof q.hint === "function" ? q.hint(A) : q.hint;
    return (react ? react + "\n\n" : "") + (q.groupTitle ? q.groupTitle + "\n" : "") + KSQ.labelOf(q, A) + (hint ? "\n（" + hint + "）" : "");
  }

  function render(announce) {
    const done = answeredList();
    const cur = current();
    let html = "";
    let prev = null;
    done.forEach((q) => {
      html += `<div class="bubble bot">${esc(botText(q, prev))}</div>`;
      html += `<div class="bubble me">${esc(KSQ.display(q, A))}</div>`;
      prev = q;
    });
    // 答え終わった「詳しい条件」も、やりとりとして残す
    const dAll = detailAll();
    const dDone = dAll.filter((f) => d.meta.detailDone.includes(f.id));
    let lastHeading = null;
    dDone.forEach((f) => {
      if (f.heading !== lastHeading) {
        html += `<div class="bubble bot">${esc(f.sectionTitle === f.heading ? f.heading + "のことを、くわしく教えてください。" : f.heading)}</div>`;
        lastHeading = f.heading;
      }
      html += `<div class="bubble bot">${esc(f.label)}</div>`;
      html += `<div class="bubble me">${esc(fieldValue(f.el))}</div>`;
    });
    const dCur = cur ? null : detailCurrent();

    let lastBot;
    if (cur) {
      lastBot = botText(cur, prev);
      html += `<div class="bubble bot">${esc(lastBot)}</div>`;
    } else if (dCur) {
      if (dCur.heading !== lastHeading) {
        html += `<div class="bubble bot">${esc(dCur.sectionTitle === dCur.heading ? dCur.heading + "のことを、くわしく教えてください。" : dCur.heading)}</div>`;
      }
      lastBot = dCur.label;
      html += `<div class="bubble bot">${esc(lastBot)}</div>`;
    } else {
      const react = prev && prev.react ? prev.react(A[prev.id], A) : null;
      lastBot = (react ? react + "\n\n" : "") + "ありがとうございました。回答の確認に進みましょう。";
      html += `<div class="bubble bot">${esc(lastBot)}</div>`;
    }
    document.getElementById("log").innerHTML = html;

    const total = KSQ.visible(A).length + dAll.length;
    const nowAt = done.length + dDone.length;
    document.getElementById("count").textContent = `${Math.min(nowAt + 1, total)} / ${total}`;
    document.getElementById("bar").style.width = `${Math.round((nowAt / total) * 100)}%`;
    // 1問目では「戻る」として前のページへ戻す（1問ずつの画面と同じ動き）。
    // 以前は押せないようにしていたため、押しても何も起きず、戻れなくなっていた（2026-10-03）
    const undo = document.getElementById("undo");
    undo.textContent = (done.length === 0 && !d.meta.detailDone.length) ? "← 戻る" : "← 1つ戻す";
    panel(cur, dCur);
    if (announce) document.getElementById("live").textContent = lastBot;
    KS.save(d);
    window.scrollTo(0, document.body.scrollHeight);
  }

  function commit(q, value) {
    A[q.id] = value;
    // 人数を変えたら、年齢の欄も同じ数にそろえる
    if (q.id === "kidsCount") {
      const n = Number(value) || 0;
      const arr = Array.isArray(A.kidsAges) ? A.kidsAges.slice(0, n) : [];
      while (arr.length < n) arr.push(null);
      A.kidsAges = arr;
    }
    KS.forgetDetail(d, q.id);
    if (!d.meta.done.includes(q.id)) d.meta.done.push(q.id);
    render(true);
    const first = document.querySelector("#panel button, #panel select");
    first?.focus();
  }

  // 選択肢の説明（？）は、チャットではまとめて1つの折りたたみに出す
  function optHelp(q) {
    const items = (q.options || []).filter((o) => o.help);
    if (!items.length) return "";
    return `<details class="help" style="margin-top:8px"><summary>選択肢の意味を見る</summary><div>` +
      items.map((o) => `<p style="margin:4px 0"><b>${esc(o.label)}</b>：${esc(o.help.text)}` +
        (o.help.link ? ` <a href="${o.help.link}">くわしく読む</a>` : "") + `</p>`).join("") + `</div></details>`;
  }

  function panel(q, dCur) {
    const p = document.getElementById("panel");
    const switcher = `<p style="margin:10px 0 0"><button type="button" class="linkbtn" id="to-step">1問ずつの形式に切り替える</button></p>`;
    if (!q && dCur) {
      // 詳しい条件の欄を、そのままチャットの入力欄として置く。
      // 欄そのものは detail.js が作るので、1問ずつの画面と同じ値・同じ保存先になる
      p.replaceChildren();
      p.appendChild(dCur.el);
      dCur.extras.forEach((x) => p.appendChild(x));
      const next = document.createElement("button");
      next.type = "button";
      next.className = "btn";
      next.style.marginTop = "10px";
      next.textContent = "次へ";
      next.addEventListener("click", () => {
        if (!d.meta.detailDone.includes(dCur.id)) d.meta.detailDone.push(dCur.id);
        KS.save(d);
        render(true);
        const first = document.querySelector("#panel select, #panel input, #panel button");
        if (first) first.focus();
      });
      p.appendChild(next);
      const sw = document.createElement("p");
      sw.style.margin = "10px 0 0";
      sw.innerHTML = switcher.replace(/^<p[^>]*>|<\/p>$/g, "");
      p.appendChild(sw);
      bindSwitch();
      return;
    }
    if (!q) {
      p.innerHTML = `<a class="btn" href="/soudan/confirm/">回答の確認へ</a>` + switcher;
      bindSwitch();
      return;
    }
    const why = q.why || q.help ? `<button type="button" class="opt" id="why-btn" aria-expanded="false">なぜ聞くの？</button>` : "";
    const hintText = typeof q.hint === "function" ? q.hint(A) : q.hint;
    const whyBody = `<div class="why" id="why" hidden>${esc(hintText ? hintText + " " : "")}${esc(q.why || "")}${q.help ? "<br><b>" + esc(q.help.title) + "</b>：" + esc(q.help.body) + (q.help.link ? ` <a href="${q.help.link}">${esc(q.help.linkText || "くわしく見る")}</a>` : "") : ""}</div>`;
    let body = "";

    if (q.type === "single") {
      body = `<div class="chat-options" role="group" aria-label="${esc(KSQ.labelOf(q, A))}">` +
        q.options.map((o) => `<button type="button" class="opt${o.v === "unknown" ? " unknown" : ""}" data-v="${esc(o.v)}">${esc(o.label)}</button>`).join("") + why + optHelp(q) + `</div>`;
    } else if (q.type === "multi") {
      const sel = new Set(Array.isArray(A[q.id]) ? A[q.id] : []);
      body = `<div class="chat-options" role="group" aria-label="${esc(KSQ.labelOf(q, A))}">` +
        q.options.map((o) => `<button type="button" class="opt" data-m="${esc(o.v)}" aria-pressed="${sel.has(o.v)}">${esc(o.label)}</button>`).join("") + why + optHelp(q) + `</div>` +
        `<button type="button" class="btn" id="ok" style="margin-top:10px">${q.required ? "決定" : "決定（選ばずに進む場合もこちら）"}</button>`;
    } else if (q.type === "select") {
      body = `<label class="visually-hidden" for="sel">${esc(KSQ.labelOf(q, A))}</label><select class="select" id="sel"><option value="">選んでください</option>` +
        q.options.map((o) => `<option value="${o.v}" ${String(A[q.id]) === String(o.v) ? "selected" : ""}>${esc(o.label)}</option>`).join("") +
        `</select><div class="chat-options" style="margin-top:8px"><button type="button" class="btn inline" id="ok">決定</button>${why}</div>`;
    } else if (q.type === "ages") {
      const n = Number(A.kidsCount) || 0;
      let rows = "";
      for (let i = 0; i < n; i++) {
        rows += `<div class="field-row"><label for="age-${i}">${i + 1}人目</label><select class="select" id="age-${i}">` +
          `<option value="">選んでください</option>` +
          Array.from({ length: 26 }, (_, a) => `<option value="${a}" ${String((A.kidsAges || [])[i]) === String(a) ? "selected" : ""}>${a}歳</option>`).join("") + `</select></div>`;
      }
      body = rows + `<button type="button" class="btn" id="ok" style="margin-top:10px">決定</button>`;
    }
    p.innerHTML = body + `<p id="chat-err" class="error" role="alert" hidden></p>` + whyBody + switcher;
    bindSwitch();

    const wb = document.getElementById("why-btn");
    if (wb) wb.addEventListener("click", () => {
      const w = document.getElementById("why");
      w.hidden = !w.hidden;
      wb.setAttribute("aria-expanded", String(!w.hidden));
    });
    const err = (msg) => { const e = document.getElementById("chat-err"); e.textContent = msg; e.hidden = false; };

    p.querySelectorAll("[data-v]").forEach((b) => b.addEventListener("click", () => {
      const raw = b.dataset.v;
      commit(q, q.id === "kidsCount" ? Number(raw) : raw);
    }));
    p.querySelectorAll("[data-m]").forEach((b) => b.addEventListener("click", () => {
      b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true"));
    }));
    const ok = document.getElementById("ok");
    if (ok) ok.addEventListener("click", () => {
      if (q.type === "multi") {
        const v = [...p.querySelectorAll('[data-m][aria-pressed="true"]')].map((b) => b.dataset.m);
        if (q.required && !v.length) return err("1つ以上選んでください。");
        commit(q, v);
      } else if (q.type === "select") {
        const v = document.getElementById("sel").value;
        if (v === "") return err("選んでください。");
        commit(q, q.text ? v : Number(v));
      } else if (q.type === "ages") {
        const n = Number(A.kidsCount) || 0;
        const v = Array.from({ length: n }, (_, i) => document.getElementById("age-" + i).value);
        if (v.some((x) => x === "")) return err("お子さん全員の年齢を選んでください。");
        commit(q, v.map(Number));
      }
    });
  }

  function bindSwitch() {
    document.getElementById("to-step").addEventListener("click", () => {
      d.meta.mode = "step";
      const cur = current();
      // 詳しい条件の途中なら、1問ずつの画面でも同じ節から続ける（確認画面に飛ばさない）
      const dCur = cur ? null : detailCurrent();
      d.meta.pos = cur ? cur.id : dCur ? "detail:" + dCur.section : null;
      KS.save(d);
      location.href = cur || dCur ? "/soudan/step/" : "/soudan/confirm/";
    });
  }

  document.getElementById("undo").addEventListener("click", () => {
    // 詳しい条件に入っていたら、まずそちらを1つ戻す
    if (d.meta.detailDone.length) {
      d.meta.detailDone.pop();
      render(true);
      return;
    }
    const done = answeredList();
    const last = done[done.length - 1];
    // まだ1問も答えていないときは、前のページへ戻る
    if (!last) { location.href = "/soudan/"; return; }
    d.meta.done = d.meta.done.filter((id) => id !== last.id);
    delete A[last.id];
    render(true);
  });

  render(false);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>くわしく入力｜くらしの設計図</title>
<meta name="google-site-verification" content="jntYeujTZa7djhCeI4bXONFyIVFQTXFFajI_V447P28">
<link rel="canonical" href="https://kurashi-sekkeizu.github.io/soudan/detail/">
<link rel="stylesheet" href="/assets/style.css?v=0ee8a4">
</head>
<body class="has-lock">
<header class="app-header">
  <div class="wrap">
    <a class="linkbtn" href="/soudan/result/">← 結果に戻る</a>
    <span class="title">くわしく入力</span>
    <button type="button" class="linkbtn danger" data-delete>削除</button>
  </div>
</header>

<main class="wrap">
  <noscript><p class="note warn">相談機能はJavaScriptを有効にするとお使いいただけます。</p></noscript>
  <div id="incomplete" hidden>
    <p class="note warn">まだ答えていない質問があります。先に「かんたん」の質問に答えてください。</p>
    <a class="btn" href="/soudan/step/">続きから答える</a>
  </div>

  <div id="app" hidden>
    <h1>くわしく入力</h1>
    <p class="muted">すべての項目をここで設定できます。わからない項目はそのままで大丈夫です（一般的な目安で計算します）。</p>

    <div class="card detail-preview" aria-live="polite">
      <div class="small muted">いまの設定での見通し（運用しない場合）</div>
      <div id="preview" class="detail-preview-row"></div>
    </div>

    <div id="sections" class="section"></div>

    <div class="section"><a class="btn" href="/soudan/result/">結果に反映して見る</a></div>
  </div>
</main>
<footer class="app-footer no-print">
  <div class="wrap">
    <!-- 入力中でもサイトの他のページへ行けるようにする。
         上部のヘッダーは「戻る／進捗／削除」で手一杯なので、ここに置く
         （2026-10-03 web_tester の指摘8・利用者の指示） -->
    <nav class="nav foot-nav" aria-label="サイト内のほかのページ">
      <a href="/">トップ</a><a href="/learn/">学ぶ</a><a href="/sources/">もっと知る</a><a href="/about/">このサイトについて</a>
    </nav>
  </div>
</footer>
<div class="lock-bar">🔒 入力内容は送信されません</div>

<script src="/assets/common.js?v=43fc23"></script>
<script src="/assets/data.js?v=f854e0"></script>
<script src="/assets/questions.js?v=edf23b"></script>
<script src="/assets/calc.js?v=cb1337"></script>
<script src="/assets/detail.js?v=8b3fcb"></script>
<script>
(function () {
  "use strict";
  const d = KS.load().data;
  const A = d.answers;
  if (KSQ.visible(A).some((q) => q.required && !KSQ.isAnswered(q, A))) {
    document.getElementById("incomplete").hidden = false;
    return;
  }
  document.getElementById("app").hidden = false;

  let jumpTo = null;
  try {
    jumpTo = sessionStorage.getItem("ks-open-section");
    sessionStorage.removeItem("ks-open-section");
  } catch (e) { /* 使えない環境では全項目を閉じたまま表示 */ }

  const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  // いまの設定での見通し（数字を変えるたびに更新する）
  function preview() {
    const r = KSC.compute(d);
    const p = r.sim0.points;
    const at65 = p.find((x) => x.age === 65) || p[p.length - 1];
    const counts = { sun: 0, cloud: 0, rain: 0 };
    r.forecast.forEach((f) => { counts[f.weather] += 1; });
    const items = [
      [`${at65.age}歳時点の貯蓄`, KS.man(at65.balance)],
      ["貯蓄が底をつく時期", r.sim0.shortageAge !== null ? `⚠ ${r.sim0.shortageAge}歳ごろ` : "90歳までプラス"],
      ["天気", `☔${counts.rain} ⛅${counts.cloud} ☀️${counts.sun}`],
    ];
    const box = document.getElementById("preview");
    box.replaceChildren();
    items.forEach(([l, v]) => { const c = h("div", "detail-preview-item"); c.append(h("div", "small muted", l), h("b", null, v)); box.appendChild(c); });
  }

  KSD.build(d, { jumpTo: jumpTo, onChange: preview }).mount(document.getElementById("sections"));
  preview();
})();
</script>
</body>
</html>
